services:
  ling-3.0-flash-int4:
    # Official Ling-3.0 runtime (CUDA 13) — card's git clone URL 404s publicly.
    image: lmsysorg/sglang:dev-cu13-Ling-3.0-flash
    container_name: ling-3.0-flash-int4
    restart: unless-stopped
    ipc: host
    shm_size: "32gb"
    ports:
      - "8000:8000"
    gpus: all
    environment:
      - SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - SGLANG_JIT_DEEPGEMM_PRECOMPILE=0
      - HF_HUB_OFFLINE=1
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    # Everyday Spark serve: thinking on, 262K ctx, NEXTN (concurrency 4).
    entrypoint: ["python3", "-m", "sglang.launch_server"]
    command:
      - --model-path
      - inclusionAI/Ling-3.0-flash-int4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --nnodes
      - "1"
      - --tp-size
      - "1"
      - --trust-remote-code
      - --mem-fraction-static
      - "0.80"
      - --max-running-requests
      - "4"
      - --chunked-prefill-size
      - "8192"
      - --context-length
      - "262144"
      - --max-mamba-cache-size
      - "64"
      - --enable-fp32-lm-head
      - --disable-shared-experts-fusion
      - --speculative-algorithm
      - NEXTN
      - --tool-call-parser
      - ling3
      - --reasoning-parser
      - ling3
      - --served-model-name
      - ling-3.0-flash-int4
