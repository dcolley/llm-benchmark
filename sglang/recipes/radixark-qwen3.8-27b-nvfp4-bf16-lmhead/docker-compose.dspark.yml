# Optional DSpark draft (extra HF download). PROFILE=dspark ./start-docker.sh
services:
  qwen38-27b-nvfp4:
    command:
      - serve
      - --model-path
      - ${MODEL:-RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trust-remote-code
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen3.8-27b-nvfp4}
      - --mem-fraction-static
      - "${MEM_FRACTION_STATIC:-0.80}"
      - --attention-backend
      - flashinfer
      - --chunked-prefill-size
      - "${CHUNKED_PREFILL_SIZE:-2048}"
      - --context-length
      - "${CONTEXT_LENGTH:-32768}"
      - --disable-prefill-cuda-graph
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --speculative-algorithm
      - DSPARK
      - --speculative-draft-model-path
      - ${DRAFT_MODEL:-RadixArk/Qwen3.8-27B-DSpark}
