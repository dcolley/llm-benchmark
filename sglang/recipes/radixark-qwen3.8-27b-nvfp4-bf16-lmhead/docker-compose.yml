# RadixArk Qwen3.8-27B NVFP4 (BF16 lm_head) on DGX Spark via SGLang.
# Cookbook: https://docs.sglang.io/cookbook/autoregressive/Qwen/Qwen3.8-27B
# Spark: mem-fraction-static 0.80 (0.85 trips earlyoom). FlashInfer attn on SM121.
services:
  qwen38-27b-nvfp4:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:dev-qwen38-27b-dflash2}
    container_name: qwen38-27b-nvfp4-bf16-lmhead
    restart: unless-stopped
    ipc: host
    shm_size: "32gb"
    ports:
      - "${PORT:-8000}:8000"
    gpus: all
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    entrypoint: ["sglang"]
    command:
      - serve
      - --model-path
      - ${MODEL:-RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trust-remote-code
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen3.8-27b-nvfp4}
      - --mem-fraction-static
      - "${MEM_FRACTION_STATIC:-0.80}"
      - --attention-backend
      - flashinfer
      - --chunked-prefill-size
      - "${CHUNKED_PREFILL_SIZE:-2048}"
      - --context-length
      - "${CONTEXT_LENGTH:-32768}"
      - --disable-prefill-cuda-graph
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --speculative-algorithm
      - EAGLE
      - --speculative-num-steps
      - "3"
      - --speculative-eagle-topk
      - "1"
      - --speculative-num-draft-tokens
      - "4"
