# Runtime draft for the PhaseMesh text8 re-check.
# Host paths come from the gitignored .env file.
#
# Default (`docker compose up`) starts only the scoring service.
# Do not start training until `python scripts/check_score_gate.py` passes.
#
#   docker compose --profile fetch run --rm fetch
#   ./scripts/provenance_diff.sh    # uses UPSTREAM_DIR from .env; needs network
#   docker compose up --build score
#   python scripts/check_score_gate.py ${RESULTS_DIR}/scores.json
#   python scripts/export_artifacts.py --stage scoring --src ${RESULTS_DIR} --dest artifacts/reviewed-scoring
#   python scripts/export_artifacts.py --stage complete --src ${RESULTS_DIR} --runs-src ${RUNS_DIR} --dest artifacts/reviewed-complete
#   # only after the gate passes:
#   docker compose --profile train run --rm train-transformer
#   docker compose --profile train run --rm train-ssm
#
# One GPU per score/train service (count: 1). Fetch has no GPU reservation.
# Select which host GPU with NVIDIA_VISIBLE_DEVICES in .env.
# Outputs are owned by user: ${HOST_UID}:${HOST_GID} from .env.

x-env: &env
  HF_DIR: /data/hf
  TEXT8_DIR: /data/corpus
  TEXT8_PATH: /data/corpus/text8
  RESULTS_DIR: /work/results
  DEVICE: ${DEVICE:-cuda}
  SEED: ${SEED:-1}
  MICROBATCH: ${MICROBATCH:-4}
  WALL_SECONDS: ${WALL_SECONDS:-259200}
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
  TORCH_HOME: /work/cache/torch
  XDG_CACHE_HOME: /work/cache
  TRITON_CACHE_DIR: /work/cache/triton
  HF_HOME: /work/cache/hf

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${IMAGE_NAME:-text8-repro:phasemesh}
  working_dir: /work
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  env_file:
    - .env
  environment:
    <<: *env

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  score:
    <<: [*common, *gpu]
    network_mode: "none"
    environment:
      <<: *env
      TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "0"
      NVIDIA_TF32_OVERRIDE: "0"
    volumes:
      - ${HF_DIR}:/data/hf:ro
      - ${TEXT8_DIR}:/data/corpus:ro
      - ${RESULTS_DIR}:/work/results
      - ${CACHE_DIR}:/work/cache
    command:
      - python
      - score.py
      - --ckpt-dir
      - /data/hf
      - --data
      - /data/corpus/text8
      - --out-dir
      - /work/results
      - --device
      - cuda
      - --seed
      - ${SEED:-1}

  train-transformer:
    <<: [*common, *gpu]
    profiles: ["train"]
    network_mode: "none"
    volumes:
      - ${HF_DIR}:/data/hf:ro
      - ${TEXT8_DIR}:/data/corpus:ro
      - ${RESULTS_DIR}:/work/results
      - ${RUNS_DIR}:/work/runs
      - ${CACHE_DIR}:/work/cache
    command:
      - python
      - train_transformer.py
      - --out-dir
      - /work/runs/transformer
      - --seed
      - ${SEED:-1}
      - --data
      - /data/corpus/text8
      - --hf-dir
      - /data/hf
      - --device
      - cuda
      - --wall-seconds
      - ${WALL_SECONDS:-259200}

  train-ssm:
    <<: [*common, *gpu]
    profiles: ["train"]
    network_mode: "none"
    volumes:
      - ${HF_DIR}:/data/hf:ro
      - ${TEXT8_DIR}:/data/corpus:ro
      - ${RESULTS_DIR}:/work/results
      - ${RUNS_DIR}:/work/runs
      - ${CACHE_DIR}:/work/cache
    command:
      - python
      - train_ssm.py
      - --out-dir
      - /work/runs/ssm
      - --seed
      - ${SEED:-1}
      - --data
      - /data/corpus/text8
      - --hf-dir
      - /data/hf
      - --device
      - cuda
      - --wall-seconds
      - ${WALL_SECONDS:-259200}

  fetch:
    <<: *common
    profiles: ["fetch"]
    environment:
      <<: *env
      HF_REPO: ${HF_REPO:-MarxistLeninist/phasemesh-text8-comparison}
      HF_REVISION: ${HF_REVISION:-2eb1bef95b39e9745035044679f9d18b8ac3513a}
      HF_BASE_URL: ${HF_BASE_URL:-https://huggingface.co}
      TEXT8_URL: ${TEXT8_URL:-http://mattmahoney.net/dc/text8.zip}
      TEXT8_EXPECTED_SHA256: ${TEXT8_EXPECTED_SHA256:-6e890197040d37d85beb962ae1f041ff1d9a9ca8d20c7d99c85027eebf51dca7}
      UPSTREAM_REPO: ${UPSTREAM_REPO:-https://github.com/ashhart/PhaseMesh}
      UPSTREAM_COMMIT: ${UPSTREAM_COMMIT:-3ae43ffac6c0699857cada0865f156405fb95956}
    volumes:
      - ${HF_DIR}:/data/hf
      - ${TEXT8_DIR}:/data/corpus
      - ${RESULTS_DIR}:/work/results
      - ${CACHE_DIR}:/work/cache
    command:
      - bash
      - -lc
      - scripts/fetch_hf.sh && scripts/fetch_text8.sh
