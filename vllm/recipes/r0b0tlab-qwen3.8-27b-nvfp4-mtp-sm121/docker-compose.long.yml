# NIAH-verified 262K on single DGX Spark. Drop MTP (more KV headroom).
services:
  qwen38-27b-nvfp4-mtp:
    command:
      - --model
      - ${MODEL:-r0b0tlab/Qwen3.8-27B-NVFP4-MTP-sm121}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trust-remote-code
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen3.8-27b-nvfp4-mtp}
      - --kv-cache-dtype
      - fp8
      - --max-model-len
      - "${MAX_MODEL_LEN:-262144}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-4}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.85}"
      - --enforce-eager
      - --no-enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
